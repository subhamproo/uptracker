<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Under Maintenance</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #070b17;
      --card:    #0d1427;
      --card2:   #111929;
      --border:  rgba(255,255,255,0.07);
      --text:    #e8eaf0;
      --muted:   #6b7280;
      --dim:     #374151;
      --red:     #ef4444;
      --red-bg:  rgba(239,68,68,0.1);
      --green:   #10b981;
      --grn-bg:  rgba(16,185,129,0.1);
      --blue:    #3b82f6;
      --g1:      #6ee7b7;
      --g2:      #3b82f6;
      --warn:    #f59e0b;
      --mono:    'JetBrains Mono', monospace;
    }

    html, body { height: 100%; }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    /* Grid bg */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(59,130,246,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(59,130,246,0.04) 1px, transparent 1px);
      background-size: 44px 44px;
      pointer-events: none;
      z-index: 0;
    }

    /* Radial glow */
    body::after {
      content: '';
      position: fixed;
      top: -20%;
      left: 50%;
      transform: translateX(-50%);
      width: 700px;
      height: 400px;
      background: radial-gradient(ellipse, rgba(239,68,68,0.06) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
      transition: background 1s ease;
    }
    body.recovered::after {
      background: radial-gradient(ellipse, rgba(16,185,129,0.07) 0%, transparent 70%);
    }

    /* ── MAIN CARD ── */
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 24px;
      width: 100%;
      max-width: 580px;
      padding: 0;
      position: relative;
      z-index: 1;
      box-shadow: 0 32px 100px rgba(0,0,0,0.6);
      overflow: hidden;
    }

    /* Color top bar */
    .card-topbar {
      height: 4px;
      background: linear-gradient(90deg, var(--red), #f87171, transparent);
      animation: blink-bar 1.8s ease-in-out infinite;
      transition: background 0.6s ease;
    }
    .card-topbar.up {
      background: linear-gradient(90deg, var(--green), #34d399, transparent);
      animation: none;
    }
    @keyframes blink-bar { 0%,100%{opacity:1} 50%{opacity:.25} }

    .card-inner {
      padding: 36px 40px 32px;
    }

    /* ── HEADER ── */
    .card-head {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 24px;
    }

    .favicon-wrap {
      width: 52px;
      height: 52px;
      border-radius: 14px;
      background: var(--card2);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      flex-shrink: 0;
    }
    .favicon-wrap img { width: 100%; height: 100%; object-fit: contain; border-radius: 13px; }
    .favicon-fallback { font-size: 22px; }

    .head-text { min-width: 0; }
    .site-name {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .site-url {
      font-size: 12px;
      color: var(--muted);
      font-family: var(--mono);
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ── STATUS BANNER ── */
    .status-banner {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 18px;
      border-radius: 14px;
      margin-bottom: 22px;
      border: 1px solid;
      transition: all 0.5s ease;
    }
    .status-banner.down {
      background: var(--red-bg);
      border-color: rgba(239,68,68,0.25);
    }
    .status-banner.up {
      background: var(--grn-bg);
      border-color: rgba(16,185,129,0.25);
    }
    .status-banner.loading {
      background: rgba(59,130,246,0.07);
      border-color: rgba(59,130,246,0.15);
    }

    .status-dot {
      width: 12px; height: 12px;
      border-radius: 50%;
      flex-shrink: 0;
      position: relative;
    }
    .status-dot.down  { background: var(--red);   animation: blink-dot 1s ease-in-out infinite; }
    .status-dot.up    { background: var(--green); }
    .status-dot.loading { background: var(--blue); animation: blink-dot 1.2s ease-in-out infinite; }
    .status-dot.up::after {
      content: '';
      position: absolute;
      inset: -3px;
      border-radius: 50%;
      background: var(--green);
      opacity: 0.3;
      animation: ping 1.5s cubic-bezier(0,0,.2,1) infinite;
    }
    @keyframes blink-dot { 0%,100%{opacity:1} 50%{opacity:.2} }
    @keyframes ping { 75%,100%{transform:scale(2.5);opacity:0} }

    .status-text-wrap { flex: 1; }
    .status-title {
      font-size: 14px;
      font-weight: 600;
    }
    .status-title.down    { color: var(--red);   }
    .status-title.up      { color: var(--green); }
    .status-title.loading { color: var(--blue);  }
    .status-desc {
      font-size: 12px;
      color: var(--muted);
      margin-top: 2px;
      line-height: 1.5;
    }

    /* ── METRICS ── */
    .metrics {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 20px;
    }
    .metric {
      background: var(--card2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 12px;
      text-align: center;
    }
    .metric-val {
      font-family: var(--mono);
      font-size: 18px;
      font-weight: 700;
      color: var(--text);
      display: block;
      letter-spacing: -0.5px;
    }
    .metric-val.good { color: var(--green); }
    .metric-val.bad  { color: var(--red);   }
    .metric-val.dim  { color: var(--muted); }
    .metric-lbl {
      font-size: 10px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .7px;
      margin-top: 4px;
      display: block;
    }

    /* ── UPTIME BAR ── */
    .uptime-row {
      margin-bottom: 20px;
    }
    .uptime-header {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 7px;
    }
    .uptime-pct { font-family: var(--mono); font-weight: 600; }
    .bar-track {
      height: 6px;
      background: rgba(255,255,255,0.06);
      border-radius: 99px;
      overflow: hidden;
    }
    .bar-fill {
      height: 100%;
      border-radius: 99px;
      background: linear-gradient(90deg, var(--red), #f87171);
      transition: width 1s ease, background 0.6s ease;
      width: 0%;
    }
    .bar-fill.good { background: linear-gradient(90deg, var(--green), #34d399); }
    .bar-fill.warn { background: linear-gradient(90deg, var(--warn), #fcd34d); }

    /* ── RECOVERY NOTICE ── */
    .recovery-notice {
      display: none;
      align-items: center;
      gap: 10px;
      padding: 12px 16px;
      background: rgba(16,185,129,0.08);
      border: 1px solid rgba(16,185,129,0.25);
      border-radius: 12px;
      font-size: 13px;
      color: var(--green);
      font-weight: 500;
      margin-bottom: 20px;
      animation: slide-in .4s ease;
    }
    .recovery-notice.show { display: flex; }
    @keyframes slide-in { from{opacity:0;transform:translateY(-6px)} to{opacity:1;transform:translateY(0)} }

    .countdown-badge {
      font-family: var(--mono);
      font-size: 11px;
      background: rgba(16,185,129,0.15);
      border: 1px solid rgba(16,185,129,0.3);
      padding: 2px 8px;
      border-radius: 99px;
      margin-left: auto;
    }

    /* ── FOOTER ── */
    .card-footer {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px 40px;
      border-top: 1px solid var(--border);
      background: rgba(255,255,255,0.015);
    }

    .poll-status {
      font-size: 11px;
      color: var(--dim);
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .poll-dot {
      width: 5px; height: 5px;
      border-radius: 50%;
      background: var(--blue);
      animation: blink-dot .8s ease-in-out infinite;
    }

    .footer-links {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-left: auto;
      font-size: 11px;
    }
    .footer-links a {
      color: var(--blue);
      text-decoration: none;
    }
    .footer-links a:hover { text-decoration: underline; }
    .footer-sep { color: var(--dim); }

    .powered {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      color: var(--muted);
    }
    .powered svg { width: 12px; height: 12px; }
    .powered span {
      background: linear-gradient(135deg, var(--g1), var(--g2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      font-weight: 600;
    }

    /* ── RESPONSIVE ── */
    @media (max-width: 520px) {
      .card-inner { padding: 24px 20px 20px; }
      .card-footer { padding: 14px 20px; flex-wrap: wrap; }
      .site-name { font-size: 17px; }
      .metrics { grid-template-columns: repeat(3,1fr); gap: 7px; }
      .metric { padding: 10px 8px; }
      .metric-val { font-size: 15px; }
      .footer-links { width: 100%; margin-left: 0; justify-content: flex-end; }
    }
  </style>
</head>
<body>

<div class="card" id="card">
  <div class="card-topbar" id="topbar"></div>
  <div class="card-inner">

    <!-- Header -->
    <div class="card-head">
      <div class="favicon-wrap" id="faviconWrap">
        <span class="favicon-fallback">🌐</span>
      </div>
      <div class="head-text">
        <div class="site-name" id="siteName">Loading…</div>
        <div class="site-url" id="siteUrl"></div>
      </div>
    </div>

    <!-- Status banner -->
    <div class="status-banner loading" id="statusBanner">
      <div class="status-dot loading" id="statusDot"></div>
      <div class="status-text-wrap">
        <div class="status-title loading" id="statusTitle">Checking status…</div>
        <div class="status-desc" id="statusDesc">Connecting to monitoring server</div>
      </div>
    </div>

    <!-- Metrics -->
    <div class="metrics">
      <div class="metric">
        <span class="metric-val dim" id="metricUptime">—</span>
        <span class="metric-lbl">Uptime</span>
      </div>
      <div class="metric">
        <span class="metric-val dim" id="metricResponse">—</span>
        <span class="metric-lbl">Last Resp.</span>
      </div>
      <div class="metric">
        <span class="metric-val dim" id="metricChecked">—</span>
        <span class="metric-lbl">Checked</span>
      </div>
    </div>

    <!-- Uptime bar -->
    <div class="uptime-row">
      <div class="uptime-header">
        <span>Uptime (last checks)</span>
        <span class="uptime-pct" id="uptimePct">—</span>
      </div>
      <div class="bar-track">
        <div class="bar-fill" id="barFill"></div>
      </div>
    </div>

    <!-- Recovery notice -->
    <div class="recovery-notice" id="recoveryNotice">
      <span>✅ Site is back online!</span>
      <span class="countdown-badge">Redirecting in <span id="countdownNum">5</span>s</span>
    </div>

  </div>
  <div class="card-footer">
    <div class="poll-status">
      <div class="poll-dot" id="pollDot"></div>
      <span id="pollText">Checking every 30s</span>
    </div>
    <div class="footer-links">
      <a href="#" id="visitLink">Visit anyway →</a>
      <span class="footer-sep">·</span>
      <div class="powered">
        <svg viewBox="0 0 32 32" fill="none"><circle cx="16" cy="16" r="14" stroke="url(#g)" stroke-width="2.5"/><path d="M10 16L14 20L22 12" stroke="url(#g)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><defs><linearGradient id="g" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse"><stop stop-color="#6EE7B7"/><stop offset="1" stop-color="#3B82F6"/></linearGradient></defs></svg>
        Powered by <span>Uptracker</span>
      </div>
    </div>
  </div>
</div>

<!-- Load config.js (has GitHub token + Gist ID) — graceful fail if missing -->
<script src="config.js" onerror="void 0"></script>
<script>
  // ── Query params ──────────────────────────────
  const p        = new URLSearchParams(location.search);
  const SITE_ID  = p.get('id')   || '';
  const SITE_URL = p.get('url')  || '';
  const SITE_NAME= p.get('name') || 'This website';

  const cfg   = window.UPTRACKER_CONFIG || {};
  const TOKEN = cfg.GITHUB_TOKEN || '';
  const GIST  = cfg.GIST_ID      || '';
  const FILE  = 'uptracker_data.json';

  // ── Populate static content ───────────────────
  document.getElementById('siteName').textContent = SITE_NAME;
  document.title = `${SITE_NAME} — Under Maintenance`;

  if (SITE_URL) {
    try {
      const domain = new URL(SITE_URL).hostname.replace('www.','');
      document.getElementById('siteUrl').textContent = domain;
      document.getElementById('visitLink').href = SITE_URL;

      const img = document.createElement('img');
      img.src   = `https://www.google.com/s2/favicons?domain=${domain}&sz=64`;
      img.alt   = '';
      img.onerror = () => img.remove();
      const wrap = document.getElementById('faviconWrap');
      wrap.innerHTML = '';
      wrap.appendChild(img);
    } catch {}
  } else {
    document.getElementById('visitLink').style.display = 'none';
  }

  // ── Status poll ───────────────────────────────
  let redirecting = false;
  let pollInterval;

  async function poll() {
    if (!TOKEN || !GIST) {
      // No config — show maintenance without live status
      setStatus('down');
      document.getElementById('pollText').textContent = 'Monitoring active';
      document.getElementById('pollDot').style.animation = 'none';
      return;
    }

    try {
      const res  = await fetch(`https://api.github.com/gists/${GIST}`, {
        headers: { Authorization: `token ${TOKEN}`, Accept: 'application/vnd.github.v3+json' },
        cache: 'no-store',
      });

      if (!res.ok) throw new Error(`${res.status}`);

      const json = await res.json();
      const raw  = json.files?.[FILE]?.content;
      if (!raw) throw new Error('No data');

      const data  = JSON.parse(raw);
      const site  = SITE_ID
        ? (data.sites?.find(s => s.id === SITE_ID) || data.sites?.find(s => s.url === SITE_URL))
        : data.sites?.find(s => s.url === SITE_URL);

      if (!site) throw new Error('Site not found');

      const isUp   = site.lastStatus === 'up';
      const checks = data.checks?.[site.id] || [];
      const upPct  = checks.length
        ? Math.round(checks.filter(c=>c.status==='up').length / checks.length * 100)
        : null;

      setStatus(isUp ? 'up' : 'down', site, upPct);
      document.getElementById('pollText').textContent = 'Checking every 30s';

      // Trigger redirect if recovered
      if (isUp && SITE_URL && !redirecting) startRedirect();

    } catch(e) {
      console.warn('Poll error:', e.message);
      document.getElementById('pollText').textContent = 'Status check failed — retrying';
    }
  }

  function setStatus(state, site = null, upPct = null) {
    const banner  = document.getElementById('statusBanner');
    const dot     = document.getElementById('statusDot');
    const title   = document.getElementById('statusTitle');
    const desc    = document.getElementById('statusDesc');
    const topbar  = document.getElementById('topbar');

    // Reset classes
    ['down','up','loading'].forEach(c => {
      banner.classList.remove(c);
      dot.classList.remove(c);
      title.classList.remove(c);
    });

    if (state === 'down') {
      banner.classList.add('down');
      dot.classList.add('down');
      title.classList.add('down');
      title.textContent = 'Currently Offline';
      desc.textContent  = `${SITE_NAME} is temporarily unavailable. We're working on it.`;
      topbar.className  = 'card-topbar';
    } else if (state === 'up') {
      banner.classList.add('up');
      dot.classList.add('up');
      title.classList.add('up');
      title.textContent = 'Back Online';
      desc.textContent  = `${SITE_NAME} has recovered and is responding normally.`;
      topbar.className  = 'card-topbar up';
      document.body.classList.add('recovered');
    } else {
      banner.classList.add('loading');
      dot.classList.add('loading');
      title.classList.add('loading');
      title.textContent = 'Checking status…';
      desc.textContent  = 'Connecting to monitoring server';
    }

    // Metrics
    if (site) {
      const mv = document.getElementById('metricResponse');
      mv.textContent = site.lastMs ? site.lastMs + 'ms' : '—';
      mv.className   = `metric-val ${site.lastMs < 800 ? 'good' : 'bad'}`;

      const mc = document.getElementById('metricChecked');
      mc.textContent = site.lastChecked
        ? new Date(site.lastChecked).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})
        : '—';
      mc.className = 'metric-val';
    }

    if (upPct !== null) {
      const mu = document.getElementById('metricUptime');
      mu.textContent = upPct + '%';
      mu.className   = `metric-val ${upPct >= 99 ? 'good' : upPct >= 90 ? '' : 'bad'}`;

      document.getElementById('uptimePct').textContent = upPct + '%';
      const fill = document.getElementById('barFill');
      fill.style.width = upPct + '%';
      fill.className   = `bar-fill ${upPct >= 90 ? 'good' : upPct >= 70 ? 'warn' : ''}`;
    }
  }

  function startRedirect() {
    if (redirecting) return;
    redirecting = true;
    clearInterval(pollInterval);

    const notice = document.getElementById('recoveryNotice');
    notice.classList.add('show');

    let n = 5;
    const t = setInterval(() => {
      n--;
      document.getElementById('countdownNum').textContent = n;
      if (n <= 0) {
        clearInterval(t);
        if (SITE_URL) window.location.replace(SITE_URL);
      }
    }, 1000);
  }

  // Start polling
  poll();
  pollInterval = setInterval(poll, 30000);
</script>
</body>
</html>
